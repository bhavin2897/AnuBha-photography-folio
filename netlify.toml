[build]
  command = "npm run build"
  publish = "."

[[headers]]
  for = "/dist/gallery/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/about"
  to = "/dist/about_me.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/dist/contact.html"
  status = 200
